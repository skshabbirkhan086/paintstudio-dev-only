# Local-only demonstration services. NOT for production, no TLS, Vault dev mode!
# Jenkins controller image needs external build agents with toolchains installed.
services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    ports: ["127.0.0.1:8081:8080"]
    volumes: ["jenkins_home:/var/jenkins_home"]
    restart: unless-stopped
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in .env}
      POSTGRES_DB: sonarqube
    volumes: ["sonar_db:/var/lib/postgresql/data"]
  sonarqube:
    image: sonarqube:community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Set SONAR_DB_PASSWORD in .env}
    depends_on: [postgres]
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["sonar_data:/opt/sonarqube/data", "sonar_extensions:/opt/sonarqube/extensions"]
  nexus:
    image: sonatype/nexus3:latest
    ports: ["127.0.0.1:8082:8081"]
    volumes: ["nexus_data:/nexus-data"]
  vault:
    image: hashicorp/vault:latest
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?Set a throwaway dev token in .env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    ports: ["127.0.0.1:8200:8200"]
volumes:
  jenkins_home:
  sonar_db:
  sonar_data:
  sonar_extensions:
  nexus_data:
