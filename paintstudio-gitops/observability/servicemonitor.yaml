apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paintstudio
  namespace: monitoring
  labels: { release: monitoring }
spec:
  namespaceSelector:
    matchNames: [paintstudio-dev]
  selector:
    matchLabels: { app.kubernetes.io/name: paintstudio }
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
