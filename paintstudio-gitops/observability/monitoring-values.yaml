# Dev-only kube-prometheus-stack override. Install chart as Helm release `monitoring`.
prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
alertmanager:
  alertmanagerSpec:
    secrets:
      - alertmanager-slack
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: slack-notifications
      group_by: [alertname, namespace]
    receivers:
      - name: slack-notifications
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/webhook_url
            channel: '#paintstudio-dev-alerts'
            send_resolved: true
