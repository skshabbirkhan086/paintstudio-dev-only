apiVersion: v1
kind: Service
metadata:
  name: paintstudio
  labels: { app.kubernetes.io/name: paintstudio }
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: /metrics
    prometheus.io/port: '80'
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: paintstudio }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
