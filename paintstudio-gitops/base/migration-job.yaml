apiVersion: batch/v1
kind: Job
metadata:
  name: paintstudio-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 1654, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: migrate
          image: paintstudio:bootstrap
          command: [dotnet, PaintStudio.Api.dll, --migrate]
          env:
            - name: PaintDb__Server
              valueFrom: { configMapKeyRef: { name: paintstudio-config, key: server } }
            - name: PaintDb__User
              valueFrom: { secretKeyRef: { name: paintstudio-db, key: username } }
            - name: PaintDb__Password
              valueFrom: { secretKeyRef: { name: paintstudio-db, key: password } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 250m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
